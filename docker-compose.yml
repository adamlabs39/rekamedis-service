services:
  adameds-rekamedis:
    build:
      context: ./
      dockerfile: Dockerfile
      no_cache: true
    image: adameds/rekamedis:dev
    container_name: adameds-Rekamedis
    ports:
      - 8087:8087
    restart: always
    networks:
        - rekamedis-network
    environment:
      DOTENV_KEY: ${DOTENV_KEY}
    volumes:
      - type: bind
        source: /home/admin/adameds/public.key
        target: /adameds-rekam-medis/public.key
      - type: bind
        source: /home/admin/adameds/private.key
        target: /adameds-rekam-medis/private.key
      - type: bind
        source: /home/admin/adameds/.env.vault
        target: /adameds-rekam-medis/.env.vault
networks:
  rekamedis-network:
    driver: bridge